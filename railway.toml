# ─────────────────────────────────────────────────────────────────
# railway.toml — Backend SUP'ONE
# Déploiement depuis la branche `backend` du dépôt
# ─────────────────────────────────────────────────────────────────

[build]
# Docker est prioritaire sur Nixpacks si un Dockerfile est présent
builder = "DOCKERFILE"
dockerfilePath = "backend/Dockerfile"

# Répertoire de contexte de build (dossier backend/)
# Tous les chemins dans le Dockerfile sont relatifs à ce contexte
buildContext = "backend"

[deploy]
# Railway injecte $PORT automatiquement — le CMD du Dockerfile l'utilise
startCommand = ""

# Health check sur l'endpoint de statut du pipeline
healthcheckPath = "/api/chatbot/status/"
healthcheckTimeout = 60

# Redémarrage automatique en cas de crash
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[environments.production]
# Variables supplémentaires spécifiques à la production
# (les secrets sont définis dans le dashboard Railway, pas ici)
